# Publish a tagged site version with the current export release to GitHub Pages. DEPLOYMENT.md.
# Variables: DATA_REPO (required, "owner/name"), DATA_REF (default main), DATA_PATH (default ".").
# REGISTRY_REPO (required, "owner/name", public), REGISTRY_REF (default main).
# Secret DATA_REPO_TOKEN only for a private data repo. Environment `release`: required reviewers.
# The data repo's notify-site workflow dispatches this workflow after each data push.
name: Deploy

on:
  # A new package.json version on main: tag, approve, deploy.
  push:
    branches: [main]
  # Covers a lost dispatch.
  schedule:
    - cron: '30 7 * * *'
  # The data repo after each data push, or by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      new: ${{ steps.pick.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pick the site version
        id: pick
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            tag="v$(node -p "require('./package.json').version")"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already released; nothing to deploy" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [ -z "$tag" ]; then
              echo "::error::No site release yet. Release a site version first (DEPLOYMENT.md)."
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        if: steps.pick.outputs.new == 'true'
        run: npm run -s release:notes > "$RUNNER_TEMP/notes.md"
      - name: Tag and create the prerelease
        if: steps.pick.outputs.new == 'true'
        run: |
          tag="${{ steps.pick.outputs.tag }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --prerelease --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md"

  approve:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Approved ${{ needs.version.outputs.tag }}"

  build:
    needs: [version, approve]
    if: >-
      always() && needs.version.result == 'success' && needs.version.outputs.tag != '' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Require the data repo variable
        if: vars.DATA_REPO == ''
        run: |
          echo "::error::Repository variable DATA_REPO (owner/name of the export data repo) is not set. See DEPLOYMENT.md."
          exit 1
      - name: Require the registry repo variable
        if: vars.REGISTRY_REPO == ''
        run: |
          echo "::error::Repository variable REGISTRY_REPO (owner/name of the DNS provider registry) is not set. See DEPLOYMENT.md."
          exit 1
      - name: Require the content values variable
        if: vars.CONTENT_VALUES == ''
        run: |
          echo "::error::Repository variable CONTENT_VALUES (JSON values of the content/*.md placeholders) is not set. See DEPLOYMENT.md."
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Check out the export release
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ref: ${{ vars.DATA_REF || 'main' }}
          path: export-data
          token: ${{ secrets.DATA_REPO_TOKEN || github.token }}
          persist-credentials: false
      # Into the dev registry's path: the site checkout leaves the submodule empty.
      - name: Check out the DNS provider registry
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.REGISTRY_REPO }}
          ref: ${{ vars.REGISTRY_REF || 'main' }}
          path: registry
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit, contract and component tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          CONTENT_VALUES: ${{ vars.CONTENT_VALUES }}
      - name: Validate and bundle the release
        run: npm run bundle:data -- "export-data/${{ vars.DATA_PATH || '.' }}" dist
      - name: Derive data from the release
        run: npm run derive -- dist/data dist/data/derived
      - name: Validate and bundle the registry
        run: >-
          npm run bundle:registry -- registry dist "${{ vars.REGISTRY_REPO }}"
          "$(git -C registry rev-parse HEAD)"
      - name: Record what was deployed
        run: |
          {
            echo "### Deployed"
            echo "- Site: \`${{ needs.version.outputs.tag }}\` @ \`$(git rev-parse HEAD)\`"
            echo "- Data: \`${{ vars.DATA_REPO }}\` @ \`$(git -C export-data rev-parse HEAD)\`"
            echo "- Registry: \`${{ vars.REGISTRY_REPO }}\` @ \`$(git -C registry rev-parse HEAD)\`"
            echo "- Release generated_at: \`$(node -p "require('./dist/data/manifest.json').generated_at")\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [version, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  publish-release:
    needs: [version, deploy]
    if: always() && needs.deploy.result == 'success' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark the release as latest
        run: |
          gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest
